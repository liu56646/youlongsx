# 游龙沙箱 · PR 基础检查
#
# 每个 PR 只跑 6 项「必须绿」的基础门禁；交叉编译 QEMU、真机/模拟器验证这类重活不进 CI：
#
#   1/6 仓库卫生    必需文件齐全、没提交构建产物/日志、无超大文件、无残留冲突标记
#   2/6 文档链接    Markdown 相对链接都能落地、文件是合法 UTF-8
#   3/6 Wrapper     gradle-wrapper.jar 未被替换、发行包 URL 与 SHA-256 固定
#   4/6 Kotlin 编译 全模块 Kotlin / AIDL 源码能编过（不碰 native）
#   5/6 单元测试    core-vm 的纯 JVM 单测
#   6/6 打包 APK    assembleDebug：连 NDK 骨架 native 一起过，产物可直接装
#
# 本地等价执行：
#   python3 tools/ci/check_repo_hygiene.py
#   python3 tools/ci/check_docs_links.py
#   bash tools/ci/check_wrapper.sh
#   (cd vm && ./gradlew :engine-api:compileDebugKotlin :core-vm:compileDebugKotlin :app:compileDebugKotlin)
#   (cd vm && ./gradlew :core-vm:testDebugUnitTest)
#   (cd vm && ./gradlew :app:assembleDebug)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一个 PR 连续 push 时，取消上一轮还在跑的检查。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dfile.encoding=UTF-8"

jobs:
  repo-hygiene:
    name: 基础 1/6 · 仓库卫生
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查必需文件 / 构建产物 / 大文件 / 冲突标记
        run: python3 tools/ci/check_repo_hygiene.py

  docs-links:
    name: 基础 2/6 · 文档链接
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查 Markdown 相对链接与 UTF-8 编码
        run: python3 tools/ci/check_docs_links.py

  wrapper:
    name: 基础 3/6 · Wrapper 校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 对照 Gradle 官方校验和验证 wrapper jar
        uses: gradle/actions/wrapper-validation@v4
      - name: 检查版本固定 / distributionSha256Sum / 脚本可执行位
        run: bash tools/ci/check_wrapper.sh

  compile:
    name: 基础 4/6 · Kotlin 编译
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: 编译全模块 Kotlin / AIDL 源码
        working-directory: vm
        run: >
          ./gradlew :engine-api:compileDebugKotlin :core-vm:compileDebugKotlin
          :app:compileDebugKotlin --stacktrace

  unit-test:
    name: 基础 5/6 · 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: core-vm 单元测试
        working-directory: vm
        run: ./gradlew :core-vm:testDebugUnitTest --stacktrace
      - name: 失败时导出测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            vm/core-vm/build/reports/tests/testDebugUnitTest
            vm/core-vm/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  assemble-debug:
    name: 基础 6/6 · debug APK 打包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1"
      - name: 组装 debug APK（含 NDK 骨架 native 编译）
        working-directory: vm
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: youlong-debug-apk
          path: vm/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
